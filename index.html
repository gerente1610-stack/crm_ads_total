<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCRM - Full Funnel & ROI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden font-sans" x-data="crmApp()" x-init="init()">

    <div class="flex h-screen w-full">
        <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0F172A] text-white transition-all duration-300 flex flex-col z-20">
            <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                <div class="w-8 h-8 bg-[#1877F2] rounded-lg flex items-center justify-center font-bold shrink-0">N</div>
                <span x-show="sidebarOpen" class="font-bold text-xl uppercase italic tracking-tighter">NetCRM Pro</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-[#1877F2]' : 'hover:bg-slate-800'" class="w-full flex items-center gap-4 p-3 rounded-xl transition-all">
                    <i data-lucide="bar-chart-3"></i> <span x-show="sidebarOpen" class="font-bold text-sm">Dashboard</span>
                </button>
                <button @click="activeTab = 'leads'" :class="activeTab === 'leads' ? 'bg-[#1877F2]' : 'hover:bg-slate-800'" class="w-full flex items-center gap-4 p-3 rounded-xl transition-all">
                    <i data-lucide="users"></i> <span x-show="sidebarOpen" class="font-bold text-sm">Leads</span>
                </button>
                <button @click="activeTab = 'kanban'" :class="activeTab === 'kanban' ? 'bg-[#1877F2]' : 'hover:bg-slate-800'" class="w-full flex items-center gap-4 p-3 rounded-xl transition-all">
                    <i data-lucide="columns"></i> <span x-show="sidebarOpen" class="font-bold text-sm">Pipeline</span>
                </button>
                <button @click="activeTab = 'expenses'" :class="activeTab === 'expenses' ? 'bg-[#1877F2]' : 'hover:bg-slate-800'" class="w-full flex items-center gap-4 p-3 rounded-xl transition-all">
                    <i data-lucide="cog"></i> <span x-show="sidebarOpen" class="font-bold text-sm">Ads & Gastos</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
                <h2 class="text-lg font-black text-slate-700 uppercase" x-text="activeTab"></h2>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-right">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Utilidad Neta</p>
                        <p class="text-sm font-black text-green-600" x-text="'$' + (totalCommission() - totalExpenses())"></p>
                    </div>
                    <button @click="openModal()" class="bg-[#1877F2] text-white px-5 py-2 rounded-lg text-xs font-black shadow-lg hover:bg-blue-600 transition-colors">
                        + NUEVO LEAD
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-auto p-6">
                
                <template x-if="activeTab === 'dashboard'">
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-red-500">
                                <p class="text-[10px] font-black text-slate-400 uppercase">Inversión</p>
                                <p class="text-xl font-black text-slate-800" x-text="'$' + totalExpenses()"></p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-green-500">
                                <p class="text-[10px] font-black text-slate-400 uppercase">Comisiones</p>
                                <p class="text-xl font-black text-slate-800" x-text="'$' + totalCommission()"></p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-blue-500">
                                <p class="text-[10px] font-black text-slate-400 uppercase">CPA Global</p>
                                <p class="text-xl font-black text-slate-800" x-text="'$' + calculateCPA()"></p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-indigo-500">
                                <p class="text-[10px] font-black text-slate-400 uppercase">ROI</p>
                                <p class="text-xl font-black text-slate-800" x-text="calculateROI() + '%'"></p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                            <template x-for="ad in activeAds" :key="ad">
                                <div class="bg-white rounded-xl border p-6 shadow-sm">
                                    <div class="flex justify-between items-center mb-6">
                                        <div>
                                            <h4 class="font-black text-slate-800 uppercase text-base" x-text="ad"></h4>
                                            <p class="text-[10px] font-bold text-blue-500" x-text="getAdLeadCount(ad) + ' LEADS TOTALES'"></p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-[10px] font-black text-slate-400 uppercase">CPA Específico</p>
                                            <p class="text-lg font-black text-blue-600" x-text="'$' + getAdCPA(ad)"></p>
                                        </div>
                                    </div>

                                    <div class="space-y-2">
                                        <p class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">Embudo de Conversión</p>
                                        <template x-for="stage in stages" :key="stage">
                                            <div class="group relative">
                                                <div class="flex justify-between items-center text-[11px] mb-1">
                                                    <span class="font-bold text-slate-600 uppercase" x-text="stage"></span>
                                                    <span class="font-black text-slate-900 bg-slate-100 px-2 py-0.5 rounded" x-text="getAdStageCount(ad, stage)"></span>
                                                </div>
                                                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                    <div class="bg-blue-500 h-full transition-all duration-500" 
                                                         :style="'width: ' + (getAdLeadCount(ad) > 0 ? (getAdStageCount(ad, stage)/getAdLeadCount(ad)*100) : 0) + '%'"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-if="activeTab === 'leads'">
                    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                            <h3 class="font-black text-xs uppercase italic">Base de Datos de Prospectos</h3>
                            <button @click="exportToExcel()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-2">
                                <i data-lucide="download" class="w-4 h-4"></i> EXPORTAR
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="px-6 py-4">Lead (Clic para editar)</th>
                                        <th class="px-6 py-4">Anuncio</th>
                                        <th class="px-6 py-4">Etapa Actual</th>
                                        <th class="px-6 py-4">Comisión</th>
                                        <th class="px-6 py-4">Fecha Venta Instalada</th>
                                        <th class="px-6 py-4">Fecha Registro</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="lead in leads" :key="lead.id">
                                        <tr @click="openModal(lead)" class="hover:bg-blue-50 cursor-pointer transition-colors group">
                                            <td class="px-6 py-4">
                                                <div class="font-black text-blue-600 group-hover:underline" x-text="lead.phone"></div>
                                                <div class="text-[10px] text-slate-400 uppercase font-bold" x-text="lead.name || 'Sin Nombre'"></div>
                                            </td>
                                            <td class="px-6 py-4 font-bold uppercase text-[10px] text-slate-500" x-text="lead.adName || 'Orgánico'"></td>
                                            <td class="px-6 py-4">
                                                <span :class="lead.stage === 'Venta Instalada' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'" 
                                                      class="text-[9px] font-black uppercase px-2 py-1 rounded-full" x-text="lead.stage"></span>
                                            </td>
                                            <td class="px-6 py-4 font-black text-slate-700" x-text="lead.commission ? '$'+lead.commission : '-'"></td>
                                            <td class="px-6 py-4 text-[10px] text-slate-700 font-black" x-text="lead.installDate ? lead.installDate : '-'"></td>
                                            <td class="px-6 py-4 text-[10px] text-slate-400 font-bold" x-text="new Date(lead.createdAt).toLocaleDateString()"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <template x-if="activeTab === 'kanban'">
                    <div class="flex gap-4 overflow-x-auto pb-4 h-full min-h-[500px]">
                        <template x-for="stage in stages" :key="stage">
                            <div class="flex-shrink-0 w-72 bg-slate-200/50 rounded-xl flex flex-col p-3 border border-slate-200">
                                <div class="mb-4 flex justify-between items-center px-2">
                                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-tighter" x-text="stage"></span>
                                    <span class="bg-white px-2 py-0.5 rounded text-[10px] font-black text-blue-600 shadow-sm" x-text="leads.filter(l => l.stage === stage).length"></span>
                                </div>
                                <div class="space-y-3 overflow-y-auto">
                                    <template x-for="lead in leads.filter(l => l.stage === stage)" :key="lead.id">
                                        <div @click="openModal(lead)" class="bg-white p-4 rounded-xl shadow-sm border-b-2 border-slate-200 cursor-pointer hover:border-blue-500 transition-all group">
                                            <div class="flex justify-between mb-2">
                                                <span class="text-[8px] font-black bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded uppercase" x-text="lead.source"></span>
                                                <template x-if="lead.stage === 'Venta Instalada'">
                                                    <span class="text-[10px] font-black text-green-600" x-text="'$'+lead.commission"></span>
                                                </template>
                                            </div>
                                            <h5 class="font-black text-xs text-slate-800" x-text="lead.phone"></h5>
                                            <p class="text-[9px] text-slate-400 mt-1 uppercase font-bold truncate" x-text="lead.adName || 'Orgánico'"></p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="activeTab === 'expenses'">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-1 space-y-4">
                            <div class="bg-white p-6 rounded-2xl border shadow-sm">
                                <h3 class="font-black text-sm uppercase mb-4 text-blue-600 italic border-b pb-2">1. Anuncios Activos</h3>
                                <div class="flex gap-2 mb-4">
                                    <input x-model="newAdName" @keyup.enter="addAdToList()" placeholder="Nombre de campaña..." class="flex-1 border-2 border-slate-100 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                                    <button @click="addAdToList()" class="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition-colors"><i data-lucide="plus"></i></button>
                                </div>
                                <div class="space-y-2">
                                    <template x-for="(ad, index) in activeAds" :key="index">
                                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100 hover:border-blue-200 transition-all">
                                            <span class="font-black text-[11px] uppercase text-slate-700" x-text="ad"></span>
                                            <div class="flex items-center gap-1">
                                                <button @click="editAdName(index)" class="p-1.5 text-blue-500 hover:bg-blue-100 rounded-md transition-colors">
                                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                                </button>
                                                <button @click="removeAdFromList(index)" class="p-1.5 text-red-400 hover:bg-red-50 rounded-md transition-colors">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-2 space-y-4">
                            <div class="bg-white p-6 rounded-2xl border shadow-sm">
                                <h3 class="font-black text-sm uppercase mb-4 text-red-600 italic border-b pb-2">2. Registro de Inversión</h3>
                                <form @submit.prevent="addExpense()" class="flex flex-wrap gap-4 items-end">
                                    <div class="flex-1 min-w-[200px]">
                                        <label class="text-[10px] font-black uppercase text-slate-400">Seleccionar Anuncio</label>
                                        <select x-model="expenseForm.adName" required class="w-full border-2 border-slate-100 rounded-lg p-2.5 font-bold outline-none focus:border-red-400">
                                            <option value="">-- Elegir Campaña --</option>
                                            <template x-for="ad in activeAds" :key="ad">
                                                <option :value="ad" x-text="ad"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="w-32">
                                        <label class="text-[10px] font-black uppercase text-slate-400">Monto ($)</label>
                                        <input type="number" step="0.01" x-model="expenseForm.amount" required class="w-full border-2 border-slate-100 rounded-lg p-2.5 font-bold outline-none focus:border-red-400">
                                    </div>
                                    <button type="submit" class="bg-slate-900 text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase shadow-md active:scale-95 transition-all">
                                        Registrar
                                    </button>
                                </form>
                            </div>

                            <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                        <tr><th class="px-6 py-4">Anuncio</th><th class="px-6 py-4">Monto</th><th class="px-6 py-4">Fecha</th><th class="px-6 py-4"></th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        <template x-for="(exp, index) in expenses" :key="index">
                                            <tr class="text-sm">
                                                <td class="px-6 py-4 font-black text-slate-700 uppercase text-[11px]" x-text="exp.adName"></td>
                                                <td class="px-6 py-4 font-black text-red-500" x-text="'$'+exp.amount"></td>
                                                <td class="px-6 py-4 text-slate-400 font-bold" x-text="new Date(exp.date).toLocaleDateString()"></td>
                                                <td class="px-6 py-4 text-right"><button @click="expenses.splice(index, 1)" class="text-slate-300 hover:text-red-500"><i data-lucide="x" class="w-4 h-4"></i></button></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

            </div>

            <div x-show="modalOpen" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
                    <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                        <h3 class="text-lg font-black uppercase italic" x-text="form.id ? 'Editar Lead' : 'Nuevo Registro'"></h3>
                        <button @click="modalOpen = false" class="text-slate-400 hover:text-red-500 transition-colors"><i data-lucide="x"></i></button>
                    </div>
                    <form @submit.prevent="saveLead()" class="p-6 space-y-4 text-left">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="col-span-2">
                                <label class="text-[10px] font-black uppercase text-slate-400 tracking-tighter">Teléfono Principal *</label>
                                <input x-model="form.phone" required class="w-full border-2 border-blue-50 rounded-xl p-3 focus:border-blue-500 outline-none font-black text-lg text-blue-600">
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-slate-400">Fuente *</label>
                                <select x-model="form.source" class="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none">
                                    <option value="Facebook">Facebook</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="Llamada">Llamada</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-slate-400">Anuncio Activo *</label>
                                <select x-model="form.adName" required class="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none">
                                    <option value="Orgánico">Orgánico</option>
                                    <template x-for="ad in activeAds" :key="ad">
                                        <option :value="ad" x-text="ad"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="col-span-2 border-t pt-2 my-2"><p class="text-[9px] font-black text-slate-300 uppercase italic">Campos Opcionales</p></div>
                            <div class="col-span-1"><label class="text-[10px] font-black text-slate-400 uppercase">Nombre</label><input x-model="form.name" class="w-full border border-slate-200 rounded-lg p-2 text-sm font-bold"></div>
                            <div class="col-span-1"><label class="text-[10px] font-black text-slate-400 uppercase">Plan Interés</label><input x-model="form.plan" class="w-full border border-slate-200 rounded-lg p-2 text-sm font-bold"></div>
                            <div class="col-span-2"><label class="text-[10px] font-black text-slate-400 uppercase">Correo Electrónico</label><input type="email" x-model="form.email" class="w-full border border-slate-200 rounded-lg p-2 text-sm font-bold"></div>
                            
                            <div class="col-span-2"><label class="text-[10px] font-black text-slate-400 uppercase">Etapa del Proceso</label>
                                <select x-model="form.stage" class="w-full border-2 border-blue-100 rounded-xl p-3 font-black text-blue-600 bg-blue-50/30 outline-none">
                                    <template x-for="s in stages" :key="s"><option :value="s" x-text="s"></option></template>
                                </select>
                            </div>

                            <template x-if="form.stage === 'Venta Instalada'">
                                <div class="col-span-2 p-4 bg-green-50 border-2 border-green-200 rounded-xl grid grid-cols-2 gap-4 animate-pulse">
                                    <div><label class="text-[10px] font-black text-green-600">Fecha Cierre</label><input type="date" x-model="form.installDate" required class="w-full border rounded p-1.5 font-black"></div>
                                    <div><label class="text-[10px] font-black text-green-600">Comisión ($)</label><input type="number" x-model="form.commission" required class="w-full border rounded p-1.5 font-black"></div>
                                </div>
                            </template>
                        </div>
                        <div class="pt-4 flex gap-2">
                            <button type="button" @click="modalOpen = false" class="flex-1 py-3 font-black text-[10px] uppercase text-slate-400">Cancelar</button>
                            <button type="submit" class="flex-1 py-3 bg-[#1877F2] text-white rounded-xl font-black text-[10px] uppercase shadow-lg">Guardar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function crmApp() {
            return {
                sidebarOpen: true,
                activeTab: 'dashboard',
                modalOpen: false,
                newAdName: '',
                activeAds: [],
                stages: ['Nuevo', '1er Contacto', '2do Contacto', 'Calificado Internet', 'Calificado Internet+TV', 'No Calificado', 'Venta Instalada', 'Perdida'],
                leads: [],
                expenses: [],
                form: {},
                expenseForm: { adName: '', amount: 0 },
                
                init() {
                    this.leads = JSON.parse(localStorage.getItem('crm_leads_v11') || '[]');
                    this.expenses = JSON.parse(localStorage.getItem('crm_exp_v11') || '[]');
                    this.activeAds = JSON.parse(localStorage.getItem('crm_ads_v11') || '["Promo Fibra Gamer", "Combo TV Familiar"]');
                    
                    this.$watch('leads', v => localStorage.setItem('crm_leads_v11', JSON.stringify(v)));
                    this.$watch('expenses', v => localStorage.setItem('crm_exp_v11', JSON.stringify(v)));
                    this.$watch('activeAds', v => localStorage.setItem('crm_ads_v11', JSON.stringify(v)));
                    
                    setTimeout(() => lucide.createIcons(), 150);
                },

                addAdToList() {
                    if (this.newAdName.trim() && !this.activeAds.includes(this.newAdName)) {
                        this.activeAds.push(this.newAdName.trim());
                        this.newAdName = '';
                        setTimeout(() => lucide.createIcons(), 50);
                    }
                },

                editAdName(index) {
                    const oldName = this.activeAds[index];
                    const newName = prompt('Nuevo nombre para este anuncio:', oldName);
                    if (newName && newName.trim() !== '' && newName !== oldName) {
                        const validated = newName.trim();
                        this.leads = this.leads.map(l => { if(l.adName === oldName) l.adName = validated; return l; });
                        this.expenses = this.expenses.map(e => { if(e.adName === oldName) e.adName = validated; return e; });
                        this.activeAds[index] = validated;
                    }
                },

                removeAdFromList(index) {
                    if (confirm('¿Eliminar anuncio? Los datos históricos no se borrarán pero el anuncio no aparecerá en nuevas listas.')) {
                        this.activeAds.splice(index, 1);
                    }
                },

                getAdLeadCount(ad) { return this.leads.filter(l => l.adName === ad).length; },
                getAdStageCount(ad, stage) { return this.leads.filter(l => l.adName === ad && l.stage === stage).length; },
                getAdSalesCount(ad) { return this.leads.filter(l => l.adName === ad && l.stage === 'Venta Instalada').length; },
                getAdTotalExpense(ad) { return this.expenses.filter(e => e.adName === ad).reduce((a, b) => a + Number(b.amount), 0); },
                getAdCPA(ad) {
                    const sales = this.getAdSalesCount(ad);
                    const cost = this.getAdTotalExpense(ad);
                    return sales > 0 ? (cost / sales).toFixed(1) : cost;
                },

                totalExpenses() { return this.expenses.reduce((acc, curr) => acc + Number(curr.amount), 0); },
                totalCommission() { return this.leads.reduce((acc, curr) => acc + Number(curr.commission || 0), 0); },
                calculateCPA() {
                    const sales = this.leads.filter(l => l.stage === 'Venta Instalada').length;
                    return sales > 0 ? (this.totalExpenses() / sales).toFixed(1) : this.totalExpenses();
                },
                calculateROI() {
                    const cost = this.totalExpenses();
                    const rev = this.totalCommission();
                    return cost > 0 ? (((rev - cost) / cost) * 100).toFixed(1) : 0;
                },

                addExpense() {
                    this.expenses.push({ ...this.expenseForm, date: new Date().toISOString() });
                    this.expenseForm.amount = 0;
                    this.expenseForm.adName = '';
                },

                openModal(lead = null) {
                    if (lead) { 
                        this.form = JSON.parse(JSON.stringify(lead)); 
                    } else { 
                        this.form = { source: 'Facebook', stage: 'Nuevo', adName: 'Orgánico', commission: 0, createdAt: new Date().toISOString(), phone: '', name: '', plan: '', email: '', installDate: '' }; 
                    }
                    this.modalOpen = true;
                    setTimeout(() => lucide.createIcons(), 100);
                },

                saveLead() {
                    if (this.form.id) { 
                        this.leads = this.leads.map(l => l.id === this.form.id ? this.form : l); 
                    } else { 
                        this.form.id = Date.now(); 
                        this.leads.push({...this.form}); 
                    }
                    this.modalOpen = false;
                },

                exportToExcel() {
                    const dataToExport = this.leads.map(lead => ({
                        "Fecha instalada": lead.installDate || '-',
                        "Nombre": lead.name || '-',
                        "Correo": lead.email || '-',
                        "Telefono": lead.phone || '-',
                        "Plan": lead.plan || '-'
                    }));
                    const ws = XLSX.utils.json_to_sheet(dataToExport);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Leads");
                    XLSX.writeFile(wb, "Reporte_Ventas_NetCRM.xlsx");
                }
            }
        }
    </script>
</body>
</html>
